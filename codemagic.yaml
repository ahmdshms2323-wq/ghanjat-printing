workflows:
  android-apk:
    name: Ghanjat Android APK
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Prepare Android project
        script: |
          flutter create --platforms=android --project-name ghanjat_printing .
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
