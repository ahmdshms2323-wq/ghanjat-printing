workflows:
  android-apk:
    name: Ghanjat Android APK
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Prepare Ghanjat project
        script: |
          cp lib/main.dart /tmp/ghanjat_main.dart

          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name ghanjat_printing .
          fi

          mkdir -p lib
          cp /tmp/ghanjat_main.dart lib/main.dart

          cat > pubspec.yaml <<'PUBSPEC'
          name: ghanjat_printing
          description: Ghanjat Printing App
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          PUBSPEC

          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
