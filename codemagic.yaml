workflows:
  android-debug-apk:
    name: Ghanjat Android APK
    max_build_duration: 30
    environment:
      flutter: stable

    scripts:
      - name: Prepare project
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

          cat > pubspec.yaml <<'PUBSPEC'
          name: ghanjat_printing
          description: Ghanjat Printing
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          PUBSPEC

          mkdir -p lib

          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const GhanjatApp());
          }

          class GhanjatApp extends StatelessWidget {
            const GhanjatApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'غنجات للطباعة',
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFF69A9A0),
                  ),
                ),
                home: const HomePage(),
              );
            }
          }

          class HomePage extends StatelessWidget {
            const HomePage({super.key});

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  backgroundColor: const Color(0xFFF5F5F5),
                  appBar: AppBar(
                    backgroundColor: const Color(0xFF3B2A60),
                    foregroundColor: Colors.white,
                    title: const Text('غنجات للطباعة'),
                    centerTitle: true,
                  ),
                  body: ListView(
                    padding: const EdgeInsets.all(16),
                    children: [
                      Container(
                        padding: const EdgeInsets.all(24),
                        decoration: BoxDecoration(
                          color: const Color(0xFF69A9A0),
                          borderRadius: BorderRadius.circular(24),
                        ),
                        child: const Column(
                          children: [
                            Icon(Icons.print, size: 65, color: Colors.white),
                            SizedBox(height: 10),
                            Text(
                              'غنجات',
                              style: TextStyle(
                                fontSize: 36,
                                fontWeight: FontWeight.bold,
                                color: Colors.white,
                              ),
                            ),
                            Text(
                              'لخدمات الطباعة',
                              style: TextStyle(
                                fontSize: 20,
                                color: Colors.white,
                              ),
                            ),
                          ],
                        ),
                      ),
                      const SizedBox(height: 20),
                      const Text(
                        'خدماتنا',
                        style: TextStyle(
                          fontSize: 23,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      const Card(child: ListTile(title: Text('بزنس كارد'))),
                      const Card(child: ListTile(title: Text('استيكرات منتجات'))),
                      const Card(child: ListTile(title: Text('أكياس بلاستيك وقماش'))),
                      const Card(child: ListTile(title: Text('لوحات إعلانية'))),
                      const Card(child: ListTile(title: Text('حروف بارزة'))),
                      const SizedBox(height: 20),
                      Container(
                        padding: const EdgeInsets.all(20),
                        decoration: BoxDecoration(
                          color: const Color(0xFF3B2A60),
                          borderRadius: BorderRadius.circular(20),
                        ),
                        child: const Column(
                          children: [
                            Text(
                              'تواصل معنا',
                              style: TextStyle(
                                color: Colors.white,
                                fontSize: 20,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            SizedBox(height: 10),
                            Text(
                              '0994482612',
                              style: TextStyle(color: Colors.white, fontSize: 20),
                            ),
                            Text(
                              '0115494130',
                              style: TextStyle(color: Colors.white, fontSize: 20),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          DART

          flutter pub get

      - name: Build debug APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
