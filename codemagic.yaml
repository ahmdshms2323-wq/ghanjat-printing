workflows:
  android-debug-apk:
    name: Ghanjat Android APK
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Create and build Ghanjat
        script: |
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
