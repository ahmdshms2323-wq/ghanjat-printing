workflows:
  android-apk:
    name: Ghanjat Android APK
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Prepare Ghanjat
        script: |
          cp main.dart /tmp/ghanjat_main.dart

          rm -rf android
          rm -rf lib
          rm -rf ios
          rm -rf web
          rm -rf linux
          rm -rf macos
          rm -rf windows
          rm -rf test
          rm -rf .dart_tool
          rm -rf build
          rm -f pubspec.yaml
          rm -f pubspec.lock

          flutter create \
            --platforms=android \
            --project-name ghanjat_printing \
            .

          cp /tmp/ghanjat_main.dart lib/main.dart

          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
