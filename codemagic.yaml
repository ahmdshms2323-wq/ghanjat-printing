workflows:
  android-debug-apk:
    name: Ghanjat Android APK V2
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Prepare Ghanjat App V2
        script: |
          rm -rf android lib test web ios macos linux windows

          flutter create --platforms=android --project-name ghanjat_printing .

          cat > pubspec.yaml <<'PUBSPEC'
          name: ghanjat_printing
          description: Ghanjat Printing
          publish_to: "none"
          version: 2.0.0+2

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            sqflite: ^2.3.3+1
            path: ^1.9.0
            url_launcher: ^6.3.0
            font_awesome_flutter: ^10.7.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          PUBSPEC

          mkdir -p lib

          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:font_awesome_flutter/font_awesome_flutter.dart';
          import 'package:path/path.dart';
          import 'package:sqflite/sqflite.dart';
          import 'package:url_launcher/url_launcher.dart';

          void main() {
            runApp(const GhanjatApp());
          }

          class GhanjatApp extends StatelessWidget {
            const GhanjatApp({super.key});

            static const teal = Color(0xFF69A9A0);
            static const purple = Color(0xFF3D2B63);
            static const bg = Color(0xFFF5F6F8);

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'غنجات للطباعة',
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor: bg,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: teal,
                  ),
                  inputDecorationTheme: InputDecorationTheme(
                    filled: true,
                    fillColor: Colors.white,
                    border: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(15),
                      borderSide: BorderSide.none,
                    ),
                  ),
                ),
                home: const Directionality(
                  textDirection: TextDirection.rtl,
                  child: HomePage(),
                ),
              );
            }
          }

          class AppDB {
            static Database? _database;

            static Future<Database> get database async {
              if (_database != null) {
                return _database!;
              }

              final path = join(
                await getDatabasesPath(),
                'ghanjat_v2.db',
              );

              _database = await openDatabase(
                path,
                version: 1,
                onCreate: (db, version) async {
                  await db.execute('''
                    CREATE TABLE orders(
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      customer TEXT NOT NULL,
                      phone TEXT,
                      service TEXT NOT NULL,
                      quantity INTEGER NOT NULL,
                      width REAL NOT NULL,
                      height REAL NOT NULL,
                      total REAL NOT NULL,
                      paid REAL NOT NULL,
                      status TEXT NOT NULL,
                      notes TEXT,
                      created_at TEXT NOT NULL
                    )
                  ''');
                },
              );

              return _database!;
            }

            static Future<void> addOrder(
              Map<String, dynamic> data,
            ) async {
              final db = await database;
              await db.insert('orders', data);
            }

            static Future<List<Map<String, dynamic>>>
                getOrders() async {
              final db = await database;
              return db.query(
                'orders',
                orderBy: 'id DESC',
              );
            }
          }

          class HomePage extends StatefulWidget {
            const HomePage({super.key});

            @override
            State<HomePage> createState() =>
                _HomePageState();
          }

          class _HomePageState extends State<HomePage> {
            int index = 0;
            bool loading = true;

            List<Map<String, dynamic>> orders = [];

            @override
            void initState() {
              super.initState();
              loadOrders();
            }

            Future<void> loadOrders() async {
              final data = await AppDB.getOrders();

              if (!mounted) return;

              setState(() {
                orders = data;
                loading = false;
              });
            }

            void openNewOrder([String? service]) {
              Navigator.push(
                context,
                MaterialPageRoute(
                  builder: (_) => Directionality(
                    textDirection: TextDirection.rtl,
                    child: NewOrderPage(
                      initialService: service,
                      onSaved: loadOrders,
                    ),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final pages = [
                DashboardPage(
                  orders: orders,
                  onNewOrder: () => openNewOrder(),
                  onService: openNewOrder,
                ),
                OrdersPage(
                  orders: orders,
                ),
                CustomersPage(
                  orders: orders,
                ),
                const MorePage(),
              ];

              return Scaffold(
                body: SafeArea(
                  child: loading
                      ? const Center(
                          child:
                              CircularProgressIndicator(),
                        )
                      : pages[index],
                ),

                floatingActionButton:
                    FloatingActionButton(
                  backgroundColor:
                      GhanjatApp.purple,
                  foregroundColor: Colors.white,
                  onPressed: () =>
                      openNewOrder(),
                  child: const Icon(Icons.add),
                ),

                floatingActionButtonLocation:
                    FloatingActionButtonLocation
                        .centerDocked,

                bottomNavigationBar:
                    NavigationBar(
                  selectedIndex: index,
                  onDestinationSelected:
                      (value) {
                    setState(() {
                      index = value;
                    });
                  },
                  destinations: const [
                    NavigationDestination(
                      icon:
                          Icon(Icons.home_outlined),
                      selectedIcon:
                          Icon(Icons.home),
                      label: 'الرئيسية',
                    ),
                    NavigationDestination(
                      icon: Icon(
                        Icons
                            .receipt_long_outlined,
                      ),
                      selectedIcon: Icon(
                        Icons.receipt_long,
                      ),
                      label: 'الطلبات',
                    ),
                    NavigationDestination(
                      icon: Icon(
                        Icons.people_outline,
                      ),
                      selectedIcon:
                          Icon(Icons.people),
                      label: 'العملاء',
                    ),
                    NavigationDestination(
                      icon: Icon(
                        Icons.grid_view_outlined,
                      ),
                      selectedIcon:
                          Icon(Icons.grid_view),
                      label: 'المزيد',
                    ),
                  ],
                ),
              );
            }
          }

          class DashboardPage
              extends StatelessWidget {
            final List<Map<String, dynamic>>
                orders;

            final VoidCallback onNewOrder;

            final ValueChanged<String>
                onService;

            const DashboardPage({
              super.key,
              required this.orders,
              required this.onNewOrder,
              required this.onService,
            });

            @override
            Widget build(BuildContext context) {
              double sales = 0;
              double balance = 0;

              int ready = 0;
              int active = 0;

              for (final order in orders) {
                final total =
                    (order['total'] as num? ?? 0)
                        .toDouble();

                final paid =
                    (order['paid'] as num? ?? 0)
                        .toDouble();

                sales += total;

                balance +=
                    (total - paid).clamp(
                  0,
                  double.infinity,
                );

                if (order['status'] == 'جاهز') {
                  ready++;
                }

                if (order['status'] ==
                        'جاري التصميم' ||
                    order['status'] ==
                        'جاري الطباعة') {
                  active++;
                }
              }

              return ListView(
                padding: const EdgeInsets.all(16),
                children: [

                  Container(
                    padding:
                        const EdgeInsets.all(22),
                    decoration: BoxDecoration(
                      color: GhanjatApp.teal,
                      borderRadius:
                          BorderRadius.circular(25),
                    ),
                    child: const Column(
                      children: [
                        Icon(
                          Icons.print,
                          size: 60,
                          color: Colors.white,
                        ),
                        SizedBox(height: 5),
                        Text(
                          'غنجات',
                          style: TextStyle(
                            color: Colors.white,
                            fontSize: 34,
                            fontWeight:
                                FontWeight.bold,
                          ),
                        ),
                        Text(
                          'لخدمات الطباعة',
                          style: TextStyle(
                            color: Colors.white,
                            fontSize: 19,
                          ),
                        ),
                      ],
                    ),
                  ),

                  const SizedBox(height: 15),

                  SizedBox(
                    width: double.infinity,
                    child: FilledButton.icon(
                      onPressed: onNewOrder,
                      icon: const Icon(
                        Icons.add_circle_outline,
                      ),
                      label:
                          const Text('طلب جديد'),
                      style:
                          FilledButton.styleFrom(
                        backgroundColor:
                            GhanjatApp.purple,
                        foregroundColor:
                            Colors.white,
                        padding:
                            const EdgeInsets.all(
                                15),
                      ),
                    ),
                  ),

                  const SizedBox(height: 15),

                  GridView.count(
                    crossAxisCount: 2,
                    shrinkWrap: true,
                    physics:
                        const NeverScrollableScrollPhysics(),
                    mainAxisSpacing: 10,
                    crossAxisSpacing: 10,
                    childAspectRatio: 1.45,
                    children: [

                      statCard(
                        'إجمالي الطلبات',
                        '${orders.length}',
                        Icons.assignment_outlined,
                      ),

                      statCard(
                        'قيد التنفيذ',
                        '$active',
                        Icons.print_outlined,
                      ),

                      statCard(
                        'جاهزة للتسليم',
                        '$ready',
                        Icons
                            .check_circle_outline,
                      ),

                      statCard(
                        'المبالغ المتبقية',
                        '${balance.toStringAsFixed(0)} ج',
                        Icons
                            .account_balance_wallet_outlined,
                      ),

                    ],
                  ),

                  const SizedBox(height: 20),

                  const Text(
                    'خدماتنا',
                    style: TextStyle(
                      fontSize: 21,
                      fontWeight: FontWeight.bold,
                    ),
                  ),

                  const SizedBox(height: 8),

                  serviceTile(
                    'بنر',
                    Icons
                        .panorama_horizontal_outlined,
                    onService,
                  ),

                  serviceTile(
                    'بزنس كارد',
                    Icons.credit_card_outlined,
                    onService,
                  ),

                  serviceTile(
                    'استيكرات منتجات',
                    Icons.sell_outlined,
                    onService,
                  ),

                  serviceTile(
                    'أكياس بلاستيك وقماش',
                    Icons.shopping_bag_outlined,
                    onService,
                  ),

                  serviceTile(
                    'لوحات إعلانية',
                    Icons.view_quilt_outlined,
                    onService,
                  ),

                  serviceTile(
                    'حروف بارزة',
                    Icons.text_fields,
                    onService,
                  ),

                  const SizedBox(height: 20),

                  const Text(
                    'أحدث الطلبات',
                    style: TextStyle(
                      fontSize: 21,
                      fontWeight: FontWeight.bold,
                    ),
                  ),

                  const SizedBox(height: 8),

                  if (orders.isEmpty)
                    const Card(
                      child: Padding(
                        padding:
                            EdgeInsets.all(20),
                        child: Text(
                          'ما في طلبات لسه',
                          textAlign:
                              TextAlign.center,
                        ),
                      ),
                    ),

                  ...orders
                      .take(4)
                      .map(
                        (order) =>
                            OrderTile(
                          order: order,
                        ),
                      ),

                  const SizedBox(height: 20),

                  const ContactBox(),

                  const SizedBox(height: 20),

                  Text(
                    'إجمالي المبيعات: ${sales.toStringAsFixed(0)} جنيه',
                    textAlign: TextAlign.center,
                    style: const TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                ],
              );
            }

            static Widget statCard(
              String title,
              String value,
              IconData icon,
            ) {
              return Card(
                elevation: 0,
                child: Padding(
                  padding:
                      const EdgeInsets.all(13),
                  child: Column(
                    crossAxisAlignment:
                        CrossAxisAlignment.start,
                    children: [
                      Icon(
                        icon,
                        color: GhanjatApp.teal,
                      ),
                      const Spacer(),
                      Text(
                        title,
                        style: const TextStyle(
                          fontSize: 12,
                          color: Colors.black54,
                        ),
                      ),
                      Text(
                        value,
                        style: const TextStyle(
                          fontSize: 18,
                          fontWeight:
                              FontWeight.bold,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            static Widget serviceTile(
              String title,
              IconData icon,
              ValueChanged<String> callback,
            ) {
              return Card(
                elevation: 0,
                child: ListTile(
                  leading: CircleAvatar(
                    backgroundColor:
                        const Color(
                            0xFFEAF5F3),
                    child: Icon(
                      icon,
                      color:
                          GhanjatApp.purple,
                    ),
                  ),
                  title: Text(title),
                  trailing:
                      const Icon(
                    Icons.chevron_left,
                  ),
                  onTap: () =>
                      callback(title),
                ),
              );
            }
          }

          class OrderTile
              extends StatelessWidget {
            final Map<String, dynamic> order;

            const OrderTile({
              super.key,
              required this.order,
            });

            @override
            Widget build(BuildContext context) {
              final total =
                  (order['total'] as num? ?? 0)
                      .toDouble();

              final paid =
                  (order['paid'] as num? ?? 0)
                      .toDouble();

              final balance =
                  (total - paid).clamp(
                0,
                double.infinity,
              );

              return Card(
                elevation: 0,
                child: ListTile(
                  leading: const CircleAvatar(
                    child: Icon(
                      Icons.receipt_long,
                    ),
                  ),
                  title: Text(
                    order['customer']
                            ?.toString() ??
                        '',
                  ),
                  subtitle: Text(
                    '${order['service']} • ${order['status']}',
                  ),
                  trailing: Column(
                    mainAxisAlignment:
                        MainAxisAlignment.center,
                    children: [
                      Text(
                        '${total.toStringAsFixed(0)} ج',
                      ),
                      Text(
                        'باقي ${balance.toStringAsFixed(0)}',
                        style: const TextStyle(
                          fontSize: 11,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class OrdersPage
              extends StatelessWidget {
            final List<Map<String, dynamic>>
                orders;

            const OrdersPage({
              super.key,
              required this.orders,
            });

            @override
            Widget build(BuildContext context) {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  const Row(
                    children: [
                      Icon(
                        Icons.receipt_long,
                        color:
                            GhanjatApp.purple,
                      ),
                      SizedBox(width: 8),
                      Text(
                        'الطلبات',
                        style: TextStyle(
                          fontSize: 24,
                          fontWeight:
                              FontWeight.bold,
                        ),
                      ),
                    ],
                  ),

                  const SizedBox(height: 15),

                  if (orders.isEmpty)
                    const Text(
                      'لا توجد طلبات',
                    ),

                  ...orders.map(
                    (order) =>
                        OrderTile(
                      order: order,
                    ),
                  ),
                ],
              );
            }
          }

          class CustomersPage
              extends StatelessWidget {
            final List<Map<String, dynamic>>
                orders;

            const CustomersPage({
              super.key,
              required this.orders,
            });

            @override
            Widget build(BuildContext context) {
              final customers =
                  <String, String>{};

              for (final order in orders) {
                final name =
                    order['customer']
                            ?.toString() ??
                        '';

                final phone =
                    order['phone']
                            ?.toString() ??
                        '';

                if (name.isNotEmpty) {
                  customers[name] = phone;
                }
              }

              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  const Row(
                    children: [
                      Icon(
                        Icons.people,
                        color:
                            GhanjatApp.purple,
                      ),
                      SizedBox(width: 8),
                      Text(
                        'العملاء',
                        style: TextStyle(
                          fontSize: 24,
                          fontWeight:
                              FontWeight.bold,
                        ),
                      ),
                    ],
                  ),

                  const SizedBox(height: 15),

                  if (customers.isEmpty)
                    const Text(
                      'لا يوجد عملاء',
                    ),

                  ...customers.entries.map(
                    (entry) => Card(
                      child: ListTile(
                        leading:
                            const Icon(
                          Icons.person_outline,
                        ),
                        title:
                            Text(entry.key),
                        subtitle: Text(
                          entry.value.isEmpty
                              ? 'بدون رقم'
                              : entry.value,
                        ),
                      ),
                    ),
                  ),
                ],
              );
            }
          }

          class NewOrderPage
              extends StatefulWidget {
            final String? initialService;

            final Future<void> Function()
                onSaved;

            const NewOrderPage({
              super.key,
              this.initialService,
              required this.onSaved,
            });

            @override
            State<NewOrderPage>
                createState() =>
                    _NewOrderPageState();
          }

          class _NewOrderPageState
              extends State<NewOrderPage> {
            final formKey =
                GlobalKey<FormState>();

            final customer =
                TextEditingController();

            final phone =
                TextEditingController();

            final quantity =
                TextEditingController(
                    text: '1');

            final width =
                TextEditingController(
                    text: '0');

            final height =
                TextEditingController(
                    text: '0');

            final total =
                TextEditingController(
                    text: '0');

            final paid =
                TextEditingController(
                    text: '0');

            final notes =
                TextEditingController();

            late String service;

            String status = 'جديد';

            @override
            void initState() {
              super.initState();

              service =
                  widget.initialService ??
                      'بنر';
            }

            double get totalValue =>
                double.tryParse(
                  total.text,
                ) ??
                0;

            double get paidValue =>
                double.tryParse(
                  paid.text,
                ) ??
                0;

            double get balance =>
                (totalValue - paidValue)
                    .clamp(
                  0,
                  double.infinity,
                );

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Row(
                    mainAxisSize:
                        MainAxisSize.min,
                    children: [
                      Icon(
                        Icons
                            .add_circle_outline,
                      ),
                      SizedBox(width: 8),
                      Text('طلب جديد'),
                    ],
                  ),
                ),

                body: ListView(
                  padding:
                      const EdgeInsets.all(16),
                  children: [

                    Form(
                      key: formKey,
                      child: Column(
                        children: [

                          appField(
                            customer,
                            'اسم العميل',
                            Icons.person_outline,
                            required: true,
                          ),

                          const SizedBox(
                              height: 10),

                          appField(
                            phone,
                            'رقم الهاتف',
                            Icons.phone_outlined,
                            keyboard:
                                TextInputType
                                    .phone,
                          ),

                          const SizedBox(
                              height: 10),

                          DropdownButtonFormField<
                              String>(
                            value: service,
                            decoration:
                                const InputDecoration(
                              labelText:
                                  'الخدمة',
                              prefixIcon: Icon(
                                Icons
                                    .print_outlined,
                              ),
                            ),
                            items: const [
                              'بنر',
                              'بزنس كارد',
                              'استيكرات منتجات',
                              'أكياس بلاستيك وقماش',
                              'لوحات إعلانية',
                              'حروف بارزة',
                              'أخرى',
                            ]
                                .map(
                                  (e) =>
                                      DropdownMenuItem(
                                    value: e,
                                    child:
                                        Text(e),
                                  ),
                                )
                                .toList(),
                            onChanged: (v) {
                              setState(() {
                                service =
                                    v ?? service;
                              });
                            },
                          ),

                          const SizedBox(
                              height: 10),

                          appField(
                            quantity,
                            'الكمية',
                            Icons.numbers,
                            keyboard:
                                TextInputType
                                    .number,
                          ),

                          const SizedBox(
                              height: 10),

                          Row(
                            children: [

                              Expanded(
                                child:
                                    appField(
                                  width,
                                  'العرض',
                                  Icons.straighten,
                                  keyboard:
                                      TextInputType
                                          .number,
                                ),
                              ),

                              const SizedBox(
                                  width: 10),

                              Expanded(
                                child:
                                    appField(
                                  height,
                                  'الطول',
                                  Icons.height,
                                  keyboard:
                                      TextInputType
                                          .number,
                                ),
                              ),

                            ],
                          ),

                          const SizedBox(
                              height: 10),

                          appField(
                            total,
                            'السعر الإجمالي',
                            Icons
                                .payments_outlined,
                            keyboard:
                                TextInputType
                                    .number,
                            onChanged: (_) {
                              setState(() {});
                            },
                          ),

                          const SizedBox(
                              height: 10),

                          appField(
                            paid,
                            'المدفوع',
                            Icons
                                .account_balance_wallet_outlined,
                            keyboard:
                                TextInputType
                                    .number,
                            onChanged: (_) {
                              setState(() {});
                            },
                          ),

                          const SizedBox(
                              height: 10),

                          DropdownButtonFormField<
                              String>(
                            value: status,
                            decoration:
                                const InputDecoration(
                              labelText:
                                  'حالة الطلب',
                              prefixIcon: Icon(
                                Icons.timelapse,
                              ),
                            ),
                            items: const [
                              'جديد',
                              'جاري التصميم',
                              'جاري الطباعة',
                              'جاهز',
                              'تم التسليم',
                            ]
                                .map(
                                  (e) =>
                                      DropdownMenuItem(
                                    value: e,
                                    child:
                                        Text(e),
                                  ),
                                )
                                .toList(),
                            onChanged: (v) {
                              setState(() {
                                status =
                                    v ?? status;
                              });
                            },
                          ),

                          const SizedBox(
                              height: 10),

                          TextFormField(
                            controller: notes,
                            maxLines: 3,
                            decoration:
                                const InputDecoration(
                              labelText:
                                  'ملاحظات',
                              prefixIcon:
                                  Icon(
                                Icons.notes,
                              ),
                            ),
                          ),

                          const SizedBox(
                              height: 15),

                          Container(
                            width:
                                double.infinity,
                            padding:
                                const EdgeInsets
                                    .all(16),
                            decoration:
                                BoxDecoration(
                              color: const Color(
                                  0xFFEAF5F3),
                              borderRadius:
                                  BorderRadius
                                      .circular(18),
                            ),
                            child: Row(
                              mainAxisAlignment:
                                  MainAxisAlignment
                                      .spaceBetween,
                              children: [

                                const Row(
                                  children: [
                                    Icon(
                                      Icons
                                          .receipt_long_outlined,
                                      color:
                                          GhanjatApp
                                              .purple,
                                    ),
                                    SizedBox(
                                        width: 8),
                                    Text(
                                      'المتبقي',
                                      style:
                                          TextStyle(
                                        fontWeight:
                                            FontWeight
                                                .bold,
                                      ),
                                    ),
                                  ],
                                ),

                                Text(
                                  '${balance.toStringAsFixed(0)} جنيه',
                                  style:
                                      const TextStyle(
                                    color:
                                        GhanjatApp
                                            .purple,
                                    fontSize: 19,
                                    fontWeight:
                                        FontWeight
                                            .bold,
                                  ),
                                ),

                              ],
                            ),
                          ),

                          const SizedBox(
                              height: 15),

                          SizedBox(
                            width:
                                double.infinity,
                            child:
                                FilledButton.icon(
                              icon: const Icon(
                                Icons
                                    .save_outlined,
                              ),
                              label: const Text(
                                  'حفظ الطلب'),
                              style:
                                  FilledButton
                                      .styleFrom(
                                backgroundColor:
                                    GhanjatApp
                                        .purple,
                                foregroundColor:
                                    Colors.white,
                                padding:
                                    const EdgeInsets
                                        .all(15),
                              ),
                              onPressed:
                                  () async {

                                if (!(formKey
                                        .currentState
                                        ?.validate() ??
                                    false)) {
                                  return;
                                }

                                await AppDB
                                    .addOrder({
                                  'customer':
                                      customer
                                          .text
                                          .trim(),
                                  'phone':
                                      phone.text
                                          .trim(),
                                  'service':
                                      service,
                                  'quantity':
                                      int.tryParse(
                                            quantity
                                                .text,
                                          ) ??
                                          1,
                                  'width':
                                      double.tryParse(
                                            width
                                                .text,
                                          ) ??
                                          0,
                                  'height':
                                      double.tryParse(
                                            height
                                                .text,
                                          ) ??
                                          0,
                                  'total':
                                      totalValue,
                                  'paid':
                                      paidValue,
                                  'status':
                                      status,
                                  'notes':
                                      notes.text
                                          .trim(),
                                  'created_at':
                                      DateTime
                                              .now()
                                          .toIso8601String(),
                                });

                                await widget
                                    .onSaved();

                                if (!mounted) {
                                  return;
                                }

                                Navigator.pop(
                                    context);
                              },
                            ),
                          ),

                        ],
                      ),
                    ),

                  ],
                ),
              );
            }

            Widget appField(
              TextEditingController controller,
              String label,
              IconData icon, {
              TextInputType? keyboard,
              bool required = false,
              ValueChanged<String>?
                  onChanged,
            }) {
              return TextFormField(
                controller: controller,
                keyboardType: keyboard,
                onChanged: onChanged,
                validator: required
                    ? (value) {
                        if (value == null ||
                            value
                                .trim()
                                .isEmpty) {
                          return 'اكتب $label';
                        }

                        return null;
                      }
                    : null,
                decoration:
                    InputDecoration(
                  labelText: label,
                  prefixIcon:
                      Icon(icon),
                ),
              );
            }
          }

