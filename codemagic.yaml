workflows:
  android-apk:
    name: Ghanjat Android APK
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Prepare Flutter project
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
