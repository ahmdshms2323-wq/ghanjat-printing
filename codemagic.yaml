          class ContactBox
              extends StatelessWidget {
            const ContactBox({super.key});

            Future<void> openWhatsApp(
              String localNumber,
            ) async {

              final international =
                  localNumber ==
                          '0115494130'
                      ? '249115494130'
                      : '249994482612';

              final url = Uri.parse(
                'https://wa.me/$international',
              );

              await launchUrl(
                url,
                mode: LaunchMode
                    .externalApplication,
              );
            }

            @override
            Widget build(BuildContext context) {
              return Container(
                padding:
                    const EdgeInsets.all(18),
                decoration: BoxDecoration(
                  color: GhanjatApp.purple,
                  borderRadius:
                      BorderRadius.circular(22),
                ),
                child: Column(
                  children: [

                    const Text(
                      'تواصل معنا',
                      style: TextStyle(
                        color: Colors.white,
                        fontSize: 20,
                        fontWeight:
                            FontWeight.bold,
                      ),
                    ),

                    const SizedBox(height: 12),

                    whatsappButton(
                      '0115494130',
                    ),

                    const SizedBox(height: 8),

                    whatsappButton(
                      '0994482612',
                    ),

                  ],
                ),
              );
            }

            Widget whatsappButton(
              String number,
            ) {
              return SizedBox(
                width: double.infinity,
                child: OutlinedButton.icon(
                  onPressed: () =>
                      openWhatsApp(number),

                  icon: const FaIcon(
                    FontAwesomeIcons.whatsapp,
                    color:
                        Colors.greenAccent,
                    size: 24,
                  ),

                  label: Text(
                    number,
                    style: const TextStyle(
                      color: Colors.white,
                      fontSize: 19,
                    ),
                  ),

                  style:
                      OutlinedButton.styleFrom(
                    side: const BorderSide(
                      color: Colors.white24,
                    ),
                    padding:
                        const EdgeInsets
                            .symmetric(
                      vertical: 12,
                    ),
                  ),
                ),
              );
            }
          }
