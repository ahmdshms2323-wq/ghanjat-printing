workflows:
  android-debug-apk:
    name: Ghanjat Android APK V2
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Prepare Ghanjat App
        script: |
          rm -rf android lib test web ios macos linux windows
          flutter create --platforms=android --project-name ghanjat_printing .

          cat > pubspec.yaml <<'PUBSPEC'
          name: ghanjat_printing
          description: Ghanjat Printing App
          publish_to: "none"
          version: 2.0.0+2

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            sqflite: ^2.4.2
            path: ^1.9.1
            url_launcher: ^6.3.2
            font_awesome_flutter: ^10.9.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          PUBSPEC

          mkdir -p lib

          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:font_awesome_flutter/font_awesome_flutter.dart';
          import 'package:path/path.dart';
          import 'package:sqflite/sqflite.dart';
          import 'package:url_launcher/url_launcher.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const GhanjatApp());
          }

          class GhanjatApp extends StatelessWidget {
            const GhanjatApp({super.key});

            static const Color teal = Color(0xFF69A9A0);
            static const Color purple = Color(0xFF3D2B63);
            static const Color background = Color(0xFFF5F6F8);

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'غنجات للطباعة',
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor: background,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: teal,
                  ),
                  inputDecorationTheme: InputDecorationTheme(
                    filled: true,
                    fillColor: Colors.white,
                    border: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(15),
                      borderSide: BorderSide.none,
                    ),
                  ),
                ),
                home: const Directionality(
                  textDirection: TextDirection.rtl,
                  child: HomePage(),
                ),
              );
            }
          }

          class AppDB {
            static Database? _database;

            static Future<Database> get database async {
              if (_database != null) return _database!;

              final dbPath = join(
                await getDatabasesPath(),
                'ghanjat_printing.db',
              );

              _database = await openDatabase(
                dbPath,
                version: 1,
                onCreate: (db, version) async {
                  await db.execute('''
                    CREATE TABLE orders(
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      customer TEXT NOT NULL,
                      phone TEXT,
                      service TEXT NOT NULL,
                      quantity INTEGER NOT NULL,
                      total REAL NOT NULL,
                      paid REAL NOT NULL,
                      status TEXT NOT NULL,
                      notes TEXT,
                      created_at TEXT NOT NULL
                    )
                  ''');
                },
              );

              return _database!;
            }

            static Future<void> addOrder(
              Map<String, dynamic> order,
            ) async {
              final db = await database;
              await db.insert('orders', order);
            }

            static Future<List<Map<String, dynamic>>> getOrders() async {
              final db = await database;
              return db.query(
                'orders',
                orderBy: 'id DESC',
              );
            }
          }

          class HomePage extends StatefulWidget {
            const HomePage({super.key});

            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> {
            int selectedIndex = 0;
            bool loading = true;
            List<Map<String, dynamic>> orders = [];

            @override
            void initState() {
              super.initState();
              loadOrders();
            }

            Future<void> loadOrders() async {
              final data = await AppDB.getOrders();

              if (!mounted) return;

              setState(() {
                orders = data;
                loading = false;
              });
            }

            void openNewOrder([String? service]) {
              Navigator.push(
                context,
                MaterialPageRoute(
                  builder: (_) => Directionality(
                    textDirection: TextDirection.rtl,
                    child: NewOrderPage(
                      initialService: service,
                      onSaved: loadOrders,
                    ),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final pages = [
                DashboardPage(
                  orders: orders,
                  onNewOrder: () => openNewOrder(),
                  onService: openNewOrder,
                ),
                OrdersPage(orders: orders),
                CustomersPage(orders: orders),
                const MorePage(),
              ];

              return Scaffold(
                body: SafeArea(
                  child: loading
                      ? const Center(
                          child: CircularProgressIndicator(),
                        )
                      : pages[selectedIndex],
                ),

                floatingActionButton: FloatingActionButton(
                  backgroundColor: GhanjatApp.purple,
                  foregroundColor: Colors.white,
                  onPressed: () => openNewOrder(),
                  child: const Icon(Icons.add),
                ),

                floatingActionButtonLocation:
                    FloatingActionButtonLocation.centerDocked,

                bottomNavigationBar: NavigationBar(
                  selected
